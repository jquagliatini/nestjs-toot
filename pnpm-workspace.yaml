minimumReleaseAge: 10080 # 1 week

tasks:
  build:
    dependsOn:
      - ^build
  test:
    dependsOn:
      - build

packages:
  - packages/app
  - packages/cli
  - packages/e2e
  - packages/internal/*

catalog:
  "@nestjs/common": 12.3.2
  "@nestjs/core": 12.3.2
  "@nestjs/i18n": 0.0.2
  "@nestjs/testing": 12.3.2
  "@types/node": "26.6.6"
  "pg": 8.23.1
  "typescript": 7.0.2
  "vitest": "5.0.5"
  "zod": 4.6.7

minimumReleaseAgeExclude:
  - "@nestjs/platform-node@12.4.2"

allowBuilds:
  "@scarf/scarf": false
